<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      @font-face {
        font-family: "WeBenang";
        src: url("./WeBenangSans-Regular.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: "WeBenangScript";
        src: url("./WeBenangScript-Regular.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
      }

      body {
        margin: 0;
      }

      #demo {
        font-family: "WeBenang", sans-serif;
        font-size: 52.837px;
        font-style: normal;
        font-weight: 400;
        line-height: 123%;
        width: 1252px;

        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }

      .letter {
        display: inline-block;
        font-family: "WeBenang", sans-serif;
      }

      .letter.active {
        font-family: "WeBenangScript", cursive;
      }

      .space {
        display: inline-block;
        width: 0.28em;
      }

      .cursor {
        display: inline-block;
        margin-left: 2px;

        /* CHANGE THIS to whatever constant color you want */
        color: #0058dd;

        animation: blink 0.8s steps(1) infinite;
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }

        51%,
        100% {
          opacity: 0;
        }
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }

        51%,
        100% {
          opacity: 0;
        }
      }

      @keyframes cursorColors {
        0% {
          color: #e8ed1a;
        }

        16% {
          color: #f43f25;
        }

        32% {
          color: #c7dd38;
        }

        48% {
          color: #0058dd;
        }

        64% {
          color: #32b7ff;
        }

        80% {
          color: #ff87f4;
        }

        100% {
          /* color: #E8ED1A; */
        }
      }
    </style>
  </head>
  <body data-page="home">
    <header class="site-header">
      <a href="index.html">home</a><a href="#about">about</a>
    </header>
    <main>
      <section class="intro">
        <h1 class="interactive-text">
          maura is a senior copywriter who writes big, magnetic, magical ideas
          for <span class="accent">✳</span>social<span class="accent">✳</span>
          and beyond. a <span class="accent">✎</span>journalist and <u>dancer</u
          ><span class="accent">❀</span> in a past life, a dolphin in her next
          one <span class="accent">✺</span>
        </h1>
      </section>
      <section
        id="projects"
        class="project-grid"
        aria-label="Selected work"
      ></section>
      <section id="about" class="about">
        <p>About Maura — content coming soon.</p>
      </section>
    </main>
    <script src="js/data.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
